function statutoryBasicDeduction(income,year){

case 2:return h('人生のイベントと費用を整理する。','このページでは、将来の結婚・子育て・車・独立・旅行などの予定と必要資金を考えます。住宅購入費は次の「住宅」ページで計算するため、ここには入力しないでください。')+repeat('events',[['name','実現したいこと','text'],['age','実現する年齢'],['amount','必要額（円）'],['borrowAmount','このイベント用の借入額（円）'],['borrowRate','イベント借入の年利（％）'],['borrowMonthly','イベント借入の月返済額（円）']],'人生イベントを追加')+`<div class="spaced">${cards([['人生イベントの合計',man(a.events.reduce((s,e)=>s+num(e.amount),0))],['登録イベント数',a.events.length+'件']])}</div>`+`<p class="note">イベントに借入額を設定すると、その年齢で借入が実行され、イベント費用と借入入金が同時に計上されます。月返済額と利率に基づき残債も追跡します。借入額がイベント費を超える場合、余剰分は現預金に残ります。イベントのための積立専用口座は設けず、現預金・投資残高によって資金の充足を判定します。</p>`;
case 3:return h('住まいの計画を立てる。','このページでは、賃貸の引っ越し予定や住宅購入の条件を整理し、将来の住居費と資産への影響を確認します。')+`<div class="fields">${select('housing','住居の方針',[['rent','賃貸を続ける'],['buy','住宅を購入する']])}${field('rentIncrease','年間生活費上昇率','number','％（簡易インフレ前提）','0.1')}</div>`+(a.housing==='buy'?block('購入までの賃貸について',select('moveBeforeBuy','住宅購入までに賃貸で引っ越す予定はありますか？',[['no','いいえ'],['yes','はい']])+(a.moveBeforeBuy==='yes'?repeat('rentSchedule',[['age','引っ越しする年齢'],['monthly','引っ越し先の家賃（月額・円）']],'購入前の引っ越しを追加'):'')+'<p class="hint">購入後の家賃は計上しません。現在の家賃は生活費の入力を使用します。</p>'):'')+(a.housing==='buy'?block('購入プラン',`<div class="fields">${field('homeAge','購入年齢')}${field('homePrice','物件価格（円）')}${field('downPayment','頭金（円）')}${field('homeFees','諸費用（円）')}${field('loanRate','住宅ローン金利','number','％','0.1')}${field('loanYears','返済年数')}${field('homeRunning','管理費・税・修繕等の月額（円）')}${field('homeGrowth','不動産評価額の年変動率','number','％','0.1')}${field('homeSellAge','売却年齢（売却しない場合101）')}</div>`+cards([['概算月返済額',yen(mortgagePayment(Math.max(0,num(a.homePrice)-num(a.downPayment)),num(a.loanRate),num(a.loanYears)*12))],['購入時必要現金',yen(num(a.downPayment)+num(a.homeFees))],['住宅費の試算終了年齢までの総支出（購入前の家賃を含む）',yen(housingTotals().ownerTotal)],['うちローン支払利息（試算期間中）',yen(housingTotals().interestTotal)],['完済までのローン総返済予定額',yen(housingTotals().wholeLoan)],['ローン期末残高',yen(housingTotals().balance)]])):block('年齢別の家賃変更',repeat('rentSchedule',[['age','この年齢から'],['monthly','月々の家賃（円）']],'家賃の変更を追加')+cards([['現在から試算終了年齢までの家賃総額',yen(housingTotals().rentTotal)]])+`<p class="hint">家賃はここで設定した金額に置き換えます。生活費の「家賃」と二重には加算しません。</p>`));
case 4:return h('将来の売上と働き方を計画する。','このページでは、美容師の売上・働く期間・事業経費・副収入を年齢ごとに設定します。今の売上がずっと続くとは限らないことも踏まえて考えます。')+`<div class="fields">${select('plan','NYIOS利用プラン',[['standard','スタンダード：18.7万円＋10%'],['light','ライト：7.7万円＋25%'],['custom','カスタム：固定費＋売上歩合を自由入力']])}${a.plan==='custom'?`<div class="fields">${field('customFixed','固定利用料（月額・円）')}${field('customRate','売上歩合（％）','number','0〜100％','0.1')}</div>`:''}${select('salesMethod','年齢間の売上推移',[['hold','次の設定年齢まで維持'],['linear','直線的に変化']])}${field('otherIncome','その他の月間手取り収入（円）')}${field('nyiosUntilAge','美容師を辞める年齢（この年齢から技術売上・利用料ともに0円）','number','歳')}</div>`+block('事業にかかる毎月の経費',`<div class="mini"><small>NYIOS利用料（選択プランから自動反映）</small><strong>${yen(planTerms().fixed+(num(a.sales)>0?num(a.sales)*planTerms().rate:0))}／月</strong><p class="hint">月間技術売上${yen(num(a.sales))}のとき：固定${yen(planTerms().fixed)}＋売上歩合${(planTerms().rate*100).toLocaleString('ja-JP')}%。こちらは計算時に自動控除し、下の経費合計には含めません。</p></div>`+repeat('businessCosts',[['name','費目','text'],['monthly','月額（円）']],'事業経費を追加')+`<p class="hint">その他事業経費：${yen(businessExpense())}／月。利用料との二重入力を避けてください。</p>`)+block('年齢別の副収入',combinedSideIncomeRows()+`<p class="hint">名称ごとに開始・終了年齢と月収を設定し、年齢ごとに金額を上書きできます。</p>`)+block('借入・返済シミュレーション',repeat('loans',[['name','借入の用途','text'],['age','借入実行年齢'],['principal','借入額（円）'],['rate','年利（％）'],['monthly','毎月返済額（円）']],'借入予定を追加')+`<h4>人生イベントで設定済みの借入（ここで重複登録しない）</h4>${a.events.filter(e=>num(e.borrowAmount)>0).map(e=>`<p>${num(e.age)}歳｜${esc(e.name)}：${yen(num(e.borrowAmount))}、年利${num(e.borrowRate)}％、毎月${yen(num(e.borrowMonthly))}</p>`).join('')||'<p class="hint">設定なし</p>'}<p class="note">借入額は実行月に現預金へ入金し、元本残高を負債として管理します。返済額が月々の利息を下回る場合、残債が減らないため警告対象となります。借入目的の支出は人生イベント側に別途登録してください。</p>`)+block('年齢別の月間技術売上',`<p class="hint">30・40・50・60・70・80歳の6つの入力欄をこの下に常時表示しています。設定した年齢から次の設定年齢まで同じ月商が適用されます。空欄は直前の設定額を引き継ぎます。美容師を辞める年齢以降は売上0円です。</p>`+repeat('incomeSteps',[['age','年齢'],['sales','月間技術売上（円）']],'売上予測を追加'))+`<p class="note">その他収入は税・社会保険を差し引いた後の金額として扱います。サロン利用料は技術売上がある月にのみ計上します。</p>`;
case 5:return h('NISAの積立と取り崩しを計画する。','このページでは、年齢別の積立金額・想定利回り・取り崩し時期を設定し、資産額の変化を試算します。つみたて投資枠と成長投資枠は併用できます。')+`<div class="fields">${field('nisaReturn','仮定する年利','number','％','0.1')}${field('nisaWithdrawAge','取り崩し開始年齢')}${select('nisaDraw','取り崩し方法',[['fixed','毎月定額（円）'],['percent','評価額の年率（％）']])}${field('nisaWithdrawMonthly','取り崩し額・率')}</div>`+block('年齢別の積立設定',repeat('nisaSchedules',[['age','この年齢から'],['monthly','毎月の積立額（円）']],'年齢別の積立額を追加')+`<button type="button" class="btn black" data-refresh-nisa>設定を更新して再計算</button><p class="hint">積立を止める場合、その年齢に「0円」を追加してください。各年齢で設定した積立額から到達年齢を計算します（予定額ベース）。資金不足等で実際の積立が止まる場合は実績シミュレーションと異なります。投資元本が1,800万円に達したら自動的に新規のNISA積立を停止し、運用は継続します。</p>`)+cards([['現在の積立予定',yen(monthlyNisaAt(num(a.age)))+'/月'],['積立予定上の1,800万円到達年齢',nisaScheduledCapacityAge()!==null?nisaScheduledCapacityAge()+'歳':'予定積立額では未到達'],['実際の資金制約を反映した到達年齢',sim.rows.find(r=>r.nisaBasis>=18000000-1)?.age!=null?sim.rows.find(r=>r.nisaBasis>=18000000-1).age+'歳':'未到達'],['NISA未使用枠（概算）',yen(Math.max(0,18000000-num(a.nisaBasis)))],['65歳時点の評価額',man(fin.nisa)],['終了年齢時点の評価額',man(last.nisa)]])+`<div class="spaced">${svgChart(sim.rows,[{key:'nisa',name:'NISA評価額'}])}</div>${block('年齢別の年間NISA取り崩し額',nisaWithdrawalTable(sim.rows))}<p class="note">つみたて投資枠は年120万円、成長投資枠は年240万円、合計年360万円。生涯非課税保有限度額1,800万円は元本ベースです。売却による翌年以降の枠再利用、成長投資枠の生涯上限1,200万円の履歴管理には未対応です。数値は試算であり、正確な枠残高は証券会社で確認してください。一定利回りは仮定であり、利益は保証されません。</p>`;
case 6:return h('将来の年金見込額を整理する。','このページでは、これまでの納付・免除・未納・追納の期間を入力します。入力した履歴を使い、老齢基礎年金などの見込額を試算します。')+`<div class="fields">${field('pensionPaidMonths','納付済月数','number','月／20〜60歳の厚生年金・第3号加入期間も含む')}${select('pensionAuto','今後の納付予定',[['true','60歳まで全月納付（自動）'],['false','予定月数を自分で入力']])}${a.pensionAuto?'':field('pensionExpectedMonths','今後納付する月数','number','月')}${field('pensionExemptMonths','全額免除（2009年4月以降）','number','月')}${field('pensionThreeQuarterMonths','4分の3免除（2009年4月以降）','number','月／残りの保険料は納付済')}${field('pensionHalfMonths','半額免除（2009年4月以降）','number','月／残りの保険料は納付済')}${field('pensionQuarterMonths','4分の1免除（2009年4月以降）','number','月／残りの保険料は納付済')}${field('pensionStudentMonths','学生納付特例','number','月／追納前')}${field('pensionDeferMonths','納付猶予','number','月／追納前')}${field('pensionUnpaidMonths','未納月数','number','月／受給資格・金額に不算入')}${field('pensionRepaidMonths','上記免除・猶予等から追納した月数','number','月／対象月を納付扱いに変更')}</div>`+`<details class="spaced"><summary>2009年3月以前の免除期間を入力</summary><div class="fields">${field('pensionExemptOldMonths','全額免除（2009年3月以前）','number','月')}${field('pensionThreeQuarterOldMonths','4分の3免除（2009年3月以前）','number','月')}${field('pensionHalfOldMonths','半額免除（2009年3月以前）','number','月')}${field('pensionQuarterOldMonths','4分の1免除（2009年3月以前）','number','月')}</div></details>`+`<div class="fields">${field('pensionBenefitAnnual','老齢基礎年金満額（年額）','number','円／2026年度の対象者：847,300円')}${field('employeePensionAnnual','老齢厚生年金見込額（年額）','number','円／基礎年金を除く額')}${field('pensionStartAge','受給開始年齢','number','原則60〜75歳')}${select('additionalPension','付加年金',[['false','加入しない'],['true','加入する']])}${field('additionalPaidMonths','付加保険料の納付済月数','number','月')}${select('additionalAuto','今後の付加年金納付期間',[['true','60歳までの想定月数（自動）'],['false','自分で入力']])}${a.additionalAuto?'':field('additionalFutureMonths','今後の付加納付予定月数','number','月')}</div>`+cards([['年金額に反映される換算月数',pen.months.toFixed(2)+'か月'],['今後の納付予定',pen.future+'か月'],['老齢基礎年金（概算年額）',yen(pen.base)],['老齢基礎年金（月額換算）',yen(pen.base/12)],['付加年金（年額）',yen(pen.add)],['老齢厚生年金（年額）',yen(pen.employee)],['合計年金（概算年額）',yen(pen.total)]])+`<p class="hint">受給資格期間：${pen.qualifying}か月（原則120か月必要）</p>${pen.warnings.map(w=>`<div class="advice">${esc(w)}</div>`).join('')}<p class="note">2026年度の満額847,300円を基準にしています。2009年4月以降の全額免除は1/2、4分の3免除は5/8、半額免除は3/4、4分の1免除は7/8を年金額に反映します。2009年3月以前は別の割合です。学生納付特例・納付猶予は追納がなければ年金額に反映しません。追納は入力した対象月を指定順で納付扱いにする簡易計算です。納付月数を変えると65歳以降の資金計画も更新されます。誕生月や任意加入・合算対象期間など、個別の厳密な記録は「ねんきんネット」で確認してください。</p>`;

}}
function recalcUI(){return `<div class="recalculate-bar"><button type="button" class="btn black" data-recalculate>更新・再計算</button><span>ここまでの入力に基づいて再計算します。</span></div>`}
function render(){ensureDecadeSales();let steps=$('steps');steps.innerHTML=SECTION.map((s,i)=>`<button class="step ${i===page?'active':''}" data-page="${i}"><b>${String(i+1).padStart(2,'0')}</b>${s}</button>`).join('');$('progress').style.width=((page+1)/SECTION.length*100)+'%';$('content').innerHTML=sectionContent()+( [1,2,3,5,6].includes(page) && ![0,4,8].includes(page)?recalcUI():'')+`<div class="actions"><button class="btn" data-prev ${page===0?'disabled':''}>← 戻る</button><button class="btn black" data-next ${page===SECTION.length-1?'disabled':''}>${page===SECTION.length-2?'シートを完成させる':'次へ →'}</button></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>goto(+b.dataset.page)));document.querySelectorAll('[data-prev]').forEach(b=>b.addEventListener('click',()=>goto(page-1)));document.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>goto(page+1)));document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{let k=b.dataset.add;let templates={living:{name:'項目名を入力',monthly:''},businessCosts:{name:'経費名を入力',monthly:''},nisaSchedules:{age:num(state.age)+5,monthly:''},livingChanges:{age:num(state.age)+5,monthly:0},rentSchedule:{age:num(state.age)+5,monthly:0},events:{name:'イベント名を入力',age:num(state.age)+5,amount:0,funding:'cash',borrowAmount:0,borrowRate:2,borrowMonthly:0},sideIncomes:{name:'副収入',startAge:num(state.age),endAge:65,monthly:0},loans:{name:'借入',age:num(state.age)+2,principal:0,rate:2,monthly:0},incomeSteps:{age:num(state.age)+5,sales:0}};state[k].push({id:String(Date.now())+Math.random(),...templates[k]});save();render()}));document.querySelectorAll('[data-refresh-nisa]').forEach(b=>b.addEventListener('click',()=>{state.nisaScheduleVersion=(num(state.nisaScheduleVersion)+1);save();render();}));document.querySelectorAll('[data-add-side]').forEach(b=>b.addEventListener('click',()=>{state.sideIncomeSteps.push({id:String(Date.now())+Math.random(),parentId:b.dataset.addSide,age:num(state.age)+5,monthly:0});save();render()}));document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{(function(){let list=b.dataset.remove,idx=+b.dataset.i,removed=state[list]?.[idx];state[list].splice(idx,1);if(list==='sideIncomes'&&removed)state.sideIncomeSteps=state.sideIncomeSteps.filter(x=>String(x.parentId)!==String(removed.id));save();render()})()}));document.querySelectorAll('[data-export]').forEach(b=>b.addEventListener('click',()=>exportAction(b.dataset.export)));let file=$('import-file');if(file)file.addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!o||typeof o!=='object'||!Array.isArray(o.living)||!Array.isArray(o.events)||!Array.isArray(o.businessCosts)||!Array.isArray(o.incomeSteps))throw Error();state={...clone(START),...o};save();render();alert('保存データを読み込みました')}catch{alert('データの形式を確認してください')}})}
function goto(p){if(p<0||p>=SECTION.length)return;page=p;render();window.scrollTo({top:0,behavior:'instant'})}
function recalculate(){const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-recalculate]');if(b){recalculate();return}const btn=e.target.closest('[data-sheet-choice]');if(!btn)return;let sheet=btn.closest('.sheet');if(!sheet)return;sheet.dataset.sheetView=btn.dataset.sheetChoice;sheet.querySelectorAll('[data-sheet-choice]').forEach(x=>x.classList.toggle('selected',x===btn));});
document.addEventListener('input',onInput);document.addEventListener('change',onInput);
function onInput(e){let t=e.target;if(!t.matches('[data-key],[data-list],[data-action]'))return;if(e.type==='change' && !t.matches('select,input[type=checkbox],input[type=radio]'))return;
 if(t.dataset.key){let k=t.dataset.key;state[k]=t.dataset.numeric?parseInput(t.value):t.value;if(['additionalPension','pensionAuto','additionalAuto','mutualEnabled'].includes(k))state[k]=t.value==='true';if(k==='sales'){for(const row of (state.incomeSteps||[]))if(num(row.age)===num(state.age))row.sales=state.sales;}}
 else if(t.dataset.list){let o=state[t.dataset.list]?.[+t.dataset.i];if(o){o[t.dataset.prop]=t.dataset.numeric?parseInput(t.value):t.value;if(t.dataset.list==='incomeSteps'&&num(o.age)===num(state.age)&&t.dataset.prop==='sales')state.sales=o.sales;}}
 else if(t.dataset.action)state.actions[+t.dataset.action]=t.value;
 save();
 document.querySelectorAll('[data-recalculate],[data-refresh-nisa]').forEach(b=>{b.classList.add('pending');b.textContent='変更を反映して再計算';});
 // 住居方針と小規模企業共済の利用有無は、条件付きフォームと試算結果を即時更新する。
 if(e.type==='change' && t.dataset.key && ['housing','moveBeforeBuy','mutualEnabled','plan','healthType','nisaDraw','pensionAuto','additionalAuto'].includes(t.dataset.key)){
   const position=window.scrollY;
   render();
   window.scrollTo({top:position,behavior:'instant'});
   return;
 }
 if(e.type==='input'&&t.dataset.numeric){let start=t.selectionStart,old=t.value,updated=formatInput(old);if(old!==updated){t.value=updated;try{t.setSelectionRange(Math.max(0,start+updated.length-old.length),Math.max(0,start+updated.length-old.length))}catch{}}}
}
window.addEventListener('beforeprint',()=>{document.querySelectorAll('#report details').forEach(el=>el.open=true)});function download(filename,mime,body){let blob=new Blob([body],{type:mime});let url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}function expandReportDetails(){document.querySelectorAll('#report details').forEach(el=>{el.open=true;el.setAttribute('open','')});}function exportAction(action){if(action==='expand'){expandReportDetails();return}if(action==='print'){expandReportDetails();requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()));return}if(action==='json'){download('NYIOS_Life_Plan.json','application/json;charset=utf-8',JSON.stringify(state,null,2));return}if(action==='csv'){let head=['年齢','年','年間技術売上','可処分所得','年金収入','生活費','住宅関連支出','イベント費','NISA積立','NISA取り崩し','副収入','借入入金','借入返済','借入残高','現預金残高','NISA評価額','金融資産','純資産'];let data=simulate().rows.map(r=>[r.age,r.year,r.annualSales,r.disposable,r.pension,r.living,r.housing,r.events,r.invest,r.withdraw,r.sideIncome,r.borrowed,r.loanRepay,r.loanBalance,r.cash,r.nisa,r.financial,r.netWorth]);download('NYIOS_Life_Plan_Yearly.csv','text/csv;charset=utf-8','\ufeff'+[head,...data].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'));return}if(action==='import'){$('import-file').click();return}if(action==='reset'&&confirm('入力内容をすべて初期化しますか？')){state=clone(START);save();goto(0)}}
render();
</script></body></html>
